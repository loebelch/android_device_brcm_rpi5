pcm.avtp {
    type plug
    slave {
        pcm "avtp_raw"
        format S16_BE
        rate 48000
        channels 2
    }
}
pcm.avtp_raw {
    type aaf
    ifname eth0
    addr 91:E0:F0:00:FE:01
    prio 3
    streamid AA:BB:CC:DD:EE:FF:00:01
    mtt 50000
    time_uncertainty 1000
    frames_per_pdu 6
}
